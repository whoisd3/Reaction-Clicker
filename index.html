<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="description" content="Futuristic reaction time game with 3D graphics">
    <title>Reaction Driver - Test Your Reflexes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAA2klEQVRYhe2XQQ6DMAxE3yH3v0PvwB0qVapUqfwOsGDBAmVhJ07SqEKqxEqRYBE/8WxnbGcYhmEYhmF8CVjABbgCd+ARvp/A/QNcwmdbgBV4As8R4KkAN2BtgG0FnI/9VoCbAtjVAW4K4FQHuCiAWx3AVgBvdYCtAN6zAJwaoGEzQMMmgIbNe9YAY8AG7Bo+D8TXH8RXhM8TsK/97wiwA+f/BMhqAPIT0JCaB6Tk3NWUmrOeUnNGVGqOmkrNkVWpn8qp+dkgNT8dpOZItNQci5aaw9FSc0Te/N8wDMMwvuQF52RCHQWQdkgAAAAASUVORK5CYII=">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
            color: #fff;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #target {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 10px solid #ff0000;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.8), inset 0 0 50px rgba(255, 0, 0, 0.5);
            transition: all 0.3s ease;
            animation: rotate 4s linear infinite, pulse 2s ease-in-out infinite;
        }

        #target::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 6px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6), inset 0 0 30px rgba(255, 0, 0, 0.4);
        }

        #target::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), inset 0 0 20px rgba(255, 0, 0, 0.3);
        }

        #target.green {
            border-color: #00ff00;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.8), inset 0 0 50px rgba(0, 255, 0, 0.5);
        }

        #target.green::before,
        #target.green::after {
            border-color: #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.6), inset 0 0 30px rgba(0, 255, 0, 0.4);
        }

        #target.cyan {
            border-color: #00ffff;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.8), inset 0 0 50px rgba(0, 255, 255, 0.5);
        }

        #target.cyan::before,
        #target.cyan::after {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 30px rgba(0, 255, 255, 0.4);
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) translateX(0); }
            25% { transform: translate(-50%, -50%) translateX(-10px); }
            75% { transform: translate(-50%, -50%) translateX(10px); }
        }

        #target.shake {
            animation: shake 0.5s ease-in-out;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .ui-element {
            pointer-events: auto;
        }

        #menu-screen, #game-screen, #results-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: rgba(10, 10, 26, 0.95);
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); }
            to { text-shadow: 0 0 40px rgba(0, 255, 255, 1); }
        }

        h2 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #00ffff;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        button {
            background: linear-gradient(135deg, #00ffff 0%, #0080ff 100%);
            border: none;
            color: #0a0a1a;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }

        #instruction {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #ffff00;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.8);
        }

        #timer {
            font-size: 4em;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            margin: 20px 0;
        }

        .stats {
            margin: 20px 0;
            padding: 20px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.1em;
        }

        .stat-label {
            color: #00ffff;
        }

        .stat-value {
            color: #ffff00;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        #install-prompt {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 255, 255, 0.9);
            color: #0a0a1a;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transition: all 0.3s;
            z-index: 100;
        }

        #install-prompt:hover {
            transform: scale(1.05);
        }

        .click-zone {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }

        #ready-indicator {
            font-size: 2em;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            margin: 20px 0;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            h2 { font-size: 1.5em; }
            p { font-size: 1em; }
            button { font-size: 1em; padding: 12px 30px; }
            #target { width: 150px; height: 150px; }
            #target::before { width: 110px; height: 110px; }
            #target::after { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="particles-canvas"></canvas>
        <div id="target" class="hidden"></div>
    </div>
    
    <div id="ui-overlay">
        <!-- Menu Screen -->
        <div id="menu-screen" class="ui-element">
            <h1>⚡ REACTION DRIVER ⚡</h1>
            <p>Test your reflexes in this futuristic 3D reaction game!</p>
            <p>Click the targets as fast as you can when they turn green.</p>
            <button id="start-btn">START GAME</button>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Best Time:</span>
                    <span class="stat-value" id="best-time">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Games Played:</span>
                    <span class="stat-value" id="games-played">0</span>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="ui-element hidden">
            <div id="instruction">Wait for GREEN...</div>
            <div id="timer">0ms</div>
            <div id="ready-indicator" class="hidden">🎯 CLICK NOW! 🎯</div>
            <div class="click-zone" id="click-zone"></div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="ui-element hidden">
            <h2>🏆 Results 🏆</h2>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Your Time:</span>
                    <span class="stat-value" id="result-time">0ms</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Rating:</span>
                    <span class="stat-value" id="rating">-</span>
                </div>
            </div>
            <button id="play-again-btn">PLAY AGAIN</button>
            <button id="menu-btn">MAIN MENU</button>
        </div>

        <!-- Install Prompt -->
        <div id="install-prompt" class="ui-element hidden">
            📱 Install App
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
